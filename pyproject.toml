[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifekeeper"
version = "0.1.1"
description = "Reclaim your data: one page of your life from your photos, chats and posts, and answers from your own records."
readme = "docs/pypi.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Claudia Kitova" }]
keywords = ["life archive", "personal data", "data export", "timeline", "google takeout", "local-first", "digital twin"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]

dependencies = ["pillow>=10", "pywebview>=5", "opencv-python-headless>=4.8", "numpy>=1.24"]

[project.scripts]
lifekeeper = "lifekeeper.lifekeeper:main"
lifekeeper-ask = "lifekeeper.ask:main"
lifekeeper-faces = "lifekeeper.faces:main"

[project.gui-scripts]
lifekeeper-app = "lifekeeper.app:main"

[project.urls]
Homepage = "https://github.com/nubifere/lifekeeper"
Source = "https://github.com/nubifere/lifekeeper"

[tool.setuptools]
package-dir = { "lifekeeper" = "toolkit/lifekeeper" }
packages = ["lifekeeper"]

[tool.setuptools.package-data]
lifekeeper = ["icon.ico", "cities.tsv.gz"]
