name: release

# Builds the double-click apps when a version is tagged (git tag v1.0.0 && git push --tags) and attaches them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: Lifekeeper-Windows.zip
          - os: macos-latest
            artifact: Lifekeeper-Mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pillow reads the date and place stored inside photos; without it the app knows only the dates in file names
      - run: python -m pip install pyinstaller==6.11.1 pillow==12.3.0
      - name: every format reads right
        run: python -m unittest discover -s tests
      - name: build the Windows app
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Lifekeeper" --icon toolkit/lifekeeper/icon.ico --paths toolkit/lifekeeper toolkit/lifekeeper/app.py
          Compress-Archive -Path "dist/Lifekeeper.exe" -DestinationPath ${{ matrix.artifact }}
      - name: build the Mac app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "Lifekeeper" --icon toolkit/lifekeeper/icon.png --paths toolkit/lifekeeper toolkit/lifekeeper/app.py
          ditto -c -k --keepParent "dist/Lifekeeper.app" ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: "*/*.zip"
